name: Publish to npm

# Publishes on a version tag (v0.1.0, v0.2.0-rc.1, …), so a release is a
# deliberate act rather than a side effect of merging. Failed tag jobs can be
# re-run from Actions without permitting a branch to publish a package.
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm provenance: npm exchanges this OIDC token for a signed
  # attestation linking the tarball to this repo, commit, and workflow run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun for install/typecheck/test/build — it owns bun.lock, and this repo
      # has no package-lock.json, so `npm ci` would fail. npm is still set up
      # below, purely to run the publish (bun publish does not do provenance).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the publish on the same checks that run locally. A version cannot
      # be republished once taken, so it is worth failing here.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `prepack` builds dist/ during `npm publish` anyway, but running it
      # explicitly makes a build failure legible as its own step.
      - name: Build
        run: bun run build

      # Fail early and clearly if the tag does not match the version being
      # published, rather than shipping something mislabelled. This workflow is
      # tag-only, so the check always applies.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      # Confirm the tarball actually contains the built output before it goes
      # out — `files` and the build are easy to drift apart. Greps the plain
      # text listing rather than parsing `--json`, whose schema differs across
      # npm majors (this step previously broke on the CI-installed npm@latest
      # while passing locally).
      - name: Verify dist is in the tarball
        run: |
          npm pack --dry-run > /tmp/pack.txt 2>&1
          COUNT="$(grep -c 'dist/' /tmp/pack.txt || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::Tarball contains no dist/ files"
            cat /tmp/pack.txt
            exit 1
          fi
          echo "Tarball contains $COUNT dist/ entries"

      # Trusted Publishing: npm exchanges this job's OIDC token for short-lived
      # publish credentials, so there is no NPM_TOKEN to store, leak, or rotate,
      # and no 2FA bypass.
      #
      # --provenance is passed explicitly. OIDC auth alone did NOT produce an
      # attestation (verified on 0.2.1: dist.attestations was absent), so it is
      # not implied by trusted publishing the way the setup docs suggest.
      #
      # Requires a one-time setup on npmjs.com per package: Settings ->
      # Trusted Publisher -> GitHub Actions, naming this repo and the workflow
      # file (publish.yml).
      - name: Publish
        run: npm publish --provenance --access public
